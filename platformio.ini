; PlatformIO Project Configuration File

[env:esp32-s3-devkitc-1]
; 指定较新的平台版本，确保对 N16R8 OPI PSRAM 的完美支持
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ==== 内存与Flash硬件配置 (N16R8 专用) ====
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.stack_size = 32768  ; 摄像头+FreeRTOS 双task需要更大栈

; ==== 编译标志 ====
build_unflags =
    -std=gnu++11

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1            ; 开到1(Error)或2(Warn)有助于你明天调试SD卡
    -std=gnu++17
    ; --- 解决 USB CDC 与 UART0 混淆 / COM口锁死的核心配置 ---
    -DARDUINO_USB_MODE=1            ; 开启原生 USB 模式
    -DARDUINO_USB_CDC_ON_BOOT=1     ; 让 Serial 默认重定向到原生 USB
    -DCONFIG_MBEDTLS_DYNAMIC_BUFFER=1  ; 降低 SSL 握手时的内存峰值
    -DMQTT_MAX_PACKET_SIZE=1024       ; PubSubClient默认256不够告警JSON
    -include include/camera_stack_override.h
    -Wl,--wrap=xTaskCreatePinnedToCore
    -Wl,--wrap=xTaskCreate

; ==== 烧录与监视器配置 ====
upload_speed = 921600
monitor_speed = 115200
monitor_port = COM13
; 如果遇到自动复位失败，可以取消下面这行的注释
; monitor_rts = 0
; monitor_dtr = 0

; ==== 依赖库 ====
lib_deps =
    esp32-camera
    PubSubClient
    bblanchon/ArduinoJson @ ^7.0.4
    densaugeo/Base64 @ ^1.4.0
    gilmaimon/ArduinoWebsockets @ ^0.5.4
    fastled/FastLED @ ^3.7.0

build_src_filter =
    +<*>
    -<copilot*/>
